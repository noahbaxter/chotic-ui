[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chotic-ui"
version = "0.1.0"
description = "A small raw-terminal TUI toolkit (menus, real-time filter lists, themed rendering) shared across the -chotic apps."
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Noah Baxter" }]
dependencies = []

[tool.setuptools.packages.find]
include = ["chotic_ui*"]
